    <style>
        .gallery-grid {
            column-count: 4;
            column-gap: 20px;
            padding: 40px 2%;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }
        @media (min-width: 1600px) {
            .gallery-grid {
                column-count: 5;
            }
        }
        @media (max-width: 1200px) {
            .gallery-grid {
                column-count: 3;
            }
        }
        .gallery-item {
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0 var(--border-color);
            background: var(--card-bg);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            margin-bottom: 20px;
            break-inside: avoid;
            display: inline-block; /* Helps prevent breaking across columns */
            width: 100%;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .gallery-item:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 var(--border-color);
        }
        .gallery-item:active {
            transform: translate(4px, 4px);
            box-shadow: 4px 4px 0 var(--border-color);
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
        
        /* Lightbox Modal Styles */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 26, 0.95);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }
        .lightbox.active {
            display: flex;
        }
        .lightbox-content {
            max-width: 90%;
            max-height: 85%;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 15px 15px 0 var(--primary-color);
            object-fit: contain;
            background: var(--card-bg);
        }
        .close-btn {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #fff;
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
            text-shadow: 2px 2px 0 #000;
        }
        .close-btn:hover {
            color: var(--primary-color);
        }
        
        .gallery-title {
            font-size: 3rem;
            font-weight: 900;
            background: var(--card-bg);
            color: var(--text-color);
            padding: 20px;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 8px 8px 0 var(--border-color);
            display: inline-block;
        }
        .gallery-desc {
            margin-top: 20px;
            background: var(--card-bg);
            display: inline-block;
            padding: 10px 20px;
            border: var(--border-width) solid var(--border-color);
            box-shadow: 4px 4px 0 var(--border-color);
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .gallery-grid {
                column-count: 2;
                column-gap: 10px;
                padding: 20px 3%;
            }
            .gallery-item {
                margin-bottom: 10px;
            }
            .gallery-title {
                font-size: 1.8rem;
                padding: 12px;
                box-shadow: 4px 4px 0 var(--border-color);
            }
            .gallery-desc {
                font-size: 0.9rem;
                padding: 8px 15px;
                box-shadow: 3px 3px 0 var(--border-color);
            }
            .lightbox-content {
                max-width: 95%;
                max-height: 80%;
                box-shadow: 8px 8px 0 var(--primary-color);
            }
            .close-btn {
                top: 10px;
                right: 20px;
                font-size: 40px;
            }
        }
    </style>
</head>

    <!-- The Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid">
        <script>
            // We use javascript to dynamically load all images to avoid messy HTML repetition.
            const images = [
                '3.jpeg', '4.jpeg', '5.jpeg', '6.jpeg', '7.jpeg', '8.jpeg', '9.jpeg', '10.jpeg',
                '11.jpeg', '12.jpeg', '13.jpeg', '14.jpeg', '15.jpeg', '16.jpeg', '17.jpeg', '18.jpeg',
                '19.jpeg', '20.jpeg', '21.jpeg', '22.jpeg', '23.jpeg', '24.jpeg', '25.jpeg', '26.jpeg',
                '27.jpeg', '28.jpeg', '29.jpeg'
            ];
            const galleryGrid = document.querySelector('.gallery-grid');
            
            // Randomize array to make masonry look more dynamic
            const shuffledImages = images.sort(() => 0.5 - Math.random());
            
            shuffledImages.forEach(imgSrc => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `<img src="${imgSrc}" alt="Gallery image" loading="lazy">`;
                item.onclick = function() {
                    openLightbox(imgSrc);
                };
                galleryGrid.appendChild(item);
            });

            function openLightbox(src) {
                const lightbox = document.getElementById('lightbox');
                const lightboxImg = document.getElementById('lightbox-img');
                lightbox.classList.add('active');
                lightboxImg.src = src;
            }

            function closeLightbox() {
                const lightbox = document.getElementById('lightbox');
                lightbox.classList.remove('active');
            }

            // Close when clicking outside the image or pressing ESC key
            document.getElementById('lightbox').addEventListener('click', function(e) {
                if (e.target !== document.getElementById('lightbox-img')) {
                    closeLightbox();
                }
            });
            
            document.addEventListener('keydown', function(event) {
                if (event.key === "Escape") {
                    closeLightbox();
                }
            });
        </script>
    </div>
